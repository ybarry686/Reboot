{% extends "base.html" %}
{% block title %}Log in — Recovery Hub{% endblock %}
{% block content %}
  <section class="auth-form">
    <h1>Log in</h1>
    <form method="post">
      <label>Email<input type="email" name="email" required></label>
      <label>Password<input type="password" name="password" required></label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{{ url_for('auth.signup_view') }}">Sign up</a></p>
  </section>
{% endblock %}
